<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shamir Secret Sharing - Reconstruction</title>
    <link rel="stylesheet" href="reconstruction.css">
</head>
<body>
    <main class="container">
        <!-- Header -->
        <header class="header">
            <h1>Shamir Secret Sharing - Reconstruction</h1>
            <p class="subtitle">Enter shares to reconstruct the secret</p>
        </header>

        <!-- Back buttons -->
        <div class="back-container">
            <button id="backButton" class="back-button">← Back to Home</button>
        </div>

        <!-- Parameters -->
        <section class="panel">
            <h2>Parameters</h2>
            <div class="input-group">
                <label for="prime">Prime Number (p)</label>
                <input type="number" id="prime" placeholder="Enter a prime number">
                <small class="hint">Must be a prime number greater than any share value</small>
            </div>
        </section>

        <!-- Shares Input -->
        <section class="panel">
            <h2>Enter Shares</h2>
            <div class="input-group">
                <label for="sharesCount">Number of Shares</label>
                <input type="number" id="sharesCount" min="1" value="3">
                <button id="updateSharesBtn" class="secondary">Update Shares Input</button>
            </div>

            <div id="sharesInputs" class="shares-inputs">
                <!-- Shares inputs will be generated here -->
            </div>
        </section>

        <!-- Reconstruction -->
        <section class="panel">
            <h2>Reconstruction</h2>
            <div class="actions">
                <button id="reconstructBtn" class="primary">Reconstruct Secret</button>
                <button id="clearBtn" class="secondary">Clear All</button>
                <button id="homeButton" class="secondary">Return Home</button>
            </div>
            <div id="result" class="result" aria-live="polite"></div>
        </section>
    </main>

    <script src="reconstruction.js"></script>
</body>
</html>
